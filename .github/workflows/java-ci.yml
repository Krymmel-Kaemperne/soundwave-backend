# .github/workflows/java-ci.yml
name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Alpine-based JDK with Maven already included
      image: maven:3.9.9-eclipse-temurin-21-alpine

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cache Maven dependencies - hash pinning on pom.xml
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: >
            maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # 3. Run build + tests (Maven will use cached dependencies if available)
      - name: Run Tests
        run: mvn -B verify
