# .github/workflows/java-ci-docker.yml
name: Java CI with Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (if building multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image (multi-stage: build+test+runtime)
      - name: Build and Test Docker image
        run: |
          docker build \
            --target build \
            -t spring-app-build-test .

      # Build final runtime image (only if above passed)
      - name: Build Runtime Image
        run: |
          docker build \
            -t myorg/spring-app:latest .

