name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate Maven Wrapper
        run: ./mvnw -v

      - name: Build with Maven
        run: ./mvnw -B verify

      # OPTIONAL – cache manual step (if you prefer explicit caching)
      # uses: actions/cache@v4 instead of automatic Maven cache
      # Uncomment if you need full control:
      #
      # - name: Cache Maven dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.m2/repository
      #     key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw test