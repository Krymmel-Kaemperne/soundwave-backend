spring.application.name=soundwave-backend
spring.jpa.show-sql=true


# Configure transaction timeout for pessimistic locking (in seconds)
spring.jpa.properties.jakarta.persistence.lock.timeout=5
spring.jpa.properties.javax.persistence.lock.timeout=5

# Configure query timeout to prevent indefinite waiting
spring.jpa.properties.jakarta.persistence.query.timeout=10
spring.jpa.properties.javax.persistence.query.timeout=10

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=SoundwaveHikariCP
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=true

# Second level cache configuration removed

# Query optimization
spring.jpa.properties.hibernate.fetch_batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=16

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
